name: Temporary NASA POWER export

on:
  push:
    branches:
      - tmp-nasa-power-export-20260901
    paths:
      - 'scripts/_tmp_probe_nasa_power.py'
      - '.github/workflows/nasa-power-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install --quiet requests 'xarray>=2024.1' 'zarr<3' fsspec s3fs
      - name: Probe NASA POWER and INEGI
        run: python scripts/_tmp_probe_nasa_power.py
