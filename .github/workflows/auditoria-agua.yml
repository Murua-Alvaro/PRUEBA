name: Auditoría de bases hídricas V17
on:
  push:
    branches: [main]
    paths:
      - "dist/agua/**"
      - "agua-studio-v17.html"
      - "dist/agua/studio-v17.js"
      - "dist/agua/studio-v17.css"
      - "index.html"
      - "tests/agua*.cjs"
      - ".github/workflows/auditoria-agua.yml"
  pull_request:
    paths:
      - "dist/agua/**"
      - "agua-workspace-v14.js"
      - "agua-workspace-v14.html"
      - "agua-workspace-v14.css"
      - "index.html"
      - "tests/agua*.cjs"
jobs:
  verify-water-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validación de datos, navegación y filtros V17
        run: node tests/agua-studio-v17.test.cjs
