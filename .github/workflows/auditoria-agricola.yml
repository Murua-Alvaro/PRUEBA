name: Auditoría agrícola — pruebas de lógica
on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - ".github/workflows/auditoria-agricola.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - ".github/workflows/auditoria-agricola.yml"
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
