<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIGA · Operación</title><style>:root{--bg:#f4efe7;--ink:#181614;--muted:#746d65;--line:#d7cec3;--panel:#fffaf3;--accent:#9b4b2f;--ok:#315b42}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginCard{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);padding:32px}.brand{font-family:Georgia,serif;font-size:32px}.sub{color:var(--muted);font-size:13px;line-height:1.6}.field{display:grid;gap:8px;margin-top:24px}.field input{padding:13px;border:1px solid var(--line);background:#fff}.btn{border:0;background:var(--ink);color:#fff;padding:12px 16px;font-weight:700;cursor:pointer}.error{color:#9e2c22;font-size:12px;margin-top:10px}.app{display:none}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#f4efe7ee;backdrop-filter:blur(12px);z-index:5}.top b{font-family:Georgia,serif;font-size:22px}.top small{color:var(--muted)}main{padding:28px;max-width:1320px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:var(--panel);border:1px solid var(--line)}.metric{padding:18px}.metric span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.metric strong{display:block;font:400 32px Georgia,serif;margin-top:10px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}.panel{padding:20px}.panel h2{font:400 26px Georgia,serif;margin:0 0 16px}.batch{border-top:1px solid var(--line);padding:16px 0;display:grid;grid-template-columns:1fr 120px 100px auto;gap:10px;align-items:center}.batch:first-of-type{border-top:0}.batch b{font-size:14px}.batch small{display:block;color:var(--muted);margin-top:4px}.batch select,.batch input{width:100%;padding:9px;border:1px solid var(--line);background:white}.save{border:1px solid var(--ink);background:transparent;padding:9px 12px;font-weight:700;cursor:pointer}.product{display:grid;grid-template-columns:1fr 80px 85px auto;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.product:first-of-type{border-top:0}.product input{width:100%;padding:8px;border:1px solid var(--line)}.audit{max-height:420px;overflow:auto}.event{border-top:1px solid var(--line);padding:11px 0}.event:first-child{border-top:0}.event b{font-size:12px}.event small{display:block;color:var(--muted);margin-top:3px}.pill{font-size:9px;padding:4px 7px;border-radius:10px;background:#eadfd2;color:var(--accent);display:inline-block}.health{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.batch{grid-template-columns:1fr 1fr}.product{grid-template-columns:1fr 1fr}}</style></head><body><section class="login" id="login"><div class="loginCard"><div class="brand">MIGA</div><p class="sub">Panel operativo. Controla hornadas, tiempos, disponibilidad y precios. Los cambios se reflejan en la experiencia pública.</p><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">Entrar</button></div><div class="error" id="loginError"></div></div></section><section class="app" id="app"><header class="top"><div><b>MIGA · Operación</b><small id="updated"></small></div><div class="health"><span class="dot"></span><small>API operativa</small></div></header><main><div class="metrics"><div class="metric"><span>Reservas</span><strong id="mReservations">—</strong></div><div class="metric"><span>Avisos</span><strong id="mNotify">—</strong></div><div class="metric"><span>Hornadas activas</span><strong id="mBatches">—</strong></div><div class="metric"><span>Stock visible</span><strong id="mStock">—</strong></div></div><div class="grid"><section class="panel"><h2>Hornadas</h2><div id="batches"></div></section><section class="panel"><h2>Productos</h2><div id="products"></div></section></div><div class="grid"><section class="panel"><h2>Reservas recientes</h2><div id="reservations"></div></section><section class="panel"><h2>Auditoría</h2><div class="audit" id="audit"></div></section></div></main></section><script>const API=location.origin;let token=sessionStorage.getItem('miga_token')||'';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function request(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j}async function login(){try{const j=await request('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});token=j.token;sessionStorage.setItem('miga_token',token);showApp();await load()}catch(e){$('#loginError').textContent=e.message}}function showApp(){$('#login').style.display='none';$('#app').style.display='block'}async function load(){try{const d=await request('/api/admin/overview');$('#updated').textContent=' · '+new Date(d.meta.updatedAt).toLocaleString('es-MX');$('#mReservations').textContent=d.stats.reservedToday;$('#mNotify').textContent=d.stats.notifications;$('#mBatches').textContent=d.batches.filter(b=>b.status!=='soldout').length;$('#mStock').textContent=d.products.reduce((a,p)=>a+p.stock,0);$('#batches').innerHTML=d.batches.map(b=>`<div class="batch"><div><b>${esc(b.product?.name||b.productId)}</b><small>${esc(b.id)} · ${b.reserved}/${b.total} reservadas</small></div><select data-status="${b.id}"><option value="baking" ${b.status==='baking'?'selected':''}>Horneando</option><option value="fresh" ${b.status==='fresh'?'selected':''}>Recién salido</option><option value="next" ${b.status==='next'?'selected':''}>Próximo</option><option value="soldout" ${b.status==='soldout'?'selected':''}>Agotado</option></select><input type="number" min="0" value="${b.etaMinutes}" data-eta="${b.id}" title="Minutos"><button class="save" data-save-batch="${b.id}">Guardar</button></div>`).join('');$('#products').innerHTML=d.products.map(p=>`<div class="product"><div><b>${esc(p.name)}</b><small class="pill">${p.active?'Visible':'Oculto'}</small></div><input type="number" min="0" value="${p.stock}" data-stock="${p.id}"><input type="number" min="0" value="${p.price}" data-price="${p.id}"><button class="save" data-save-product="${p.id}">Guardar</button></div>`).join('');$('#reservations').innerHTML=d.reservations.length?d.reservations.map(r=>`<div class="event"><b>${esc(r.id)} · ${r.qty} pieza(s)</b><small>${esc(r.productId)} · ${new Date(r.createdAt).toLocaleString('es-MX')}</small></div>`).join(''):'<p class="sub">Sin reservas todavía.</p>';$('#audit').innerHTML=d.audit.map(a=>`<div class="event"><b>${esc(a.message)}</b><small>${new Date(a.at).toLocaleString('es-MX')} · ${esc(a.type)}</small></div>`).join('')}catch(e){if(e.message==='No autorizado'){sessionStorage.removeItem('miga_token');location.reload()}else alert(e.message)}}document.addEventListener('click',async e=>{const bid=e.target.dataset.saveBatch;if(bid){const status=document.querySelector(`[data-status="${bid}"]`).value;const etaMinutes=Number(document.querySelector(`[data-eta="${bid}"]`).value);try{await request('/api/admin/batches/'+bid,{method:'PATCH',body:JSON.stringify({status,etaMinutes,freshMinutes:status==='fresh'?0:undefined})});await load()}catch(err){alert(err.message)}}const pid=e.target.dataset.saveProduct;if(pid){const stock=Number(document.querySelector(`[data-stock="${pid}"]`).value);const price=Number(document.querySelector(`[data-price="${pid}"]`).value);try{await request('/api/admin/products/'+pid,{method:'PATCH',body:JSON.stringify({stock,price})});await load()}catch(err){alert(err.message)}}});$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(token){showApp();load()}setInterval(()=>{if(token)load()},30000);</script></body></html>
