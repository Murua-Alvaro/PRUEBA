# Growa Agricultura de Sinaloa: first public preview
# Static frontend, no paid compute or database dependencies.
# Render publishes only dist/, not the source notebooks, tests or research docs.
services:
  - type: web
    name: growa-agricultura-sinaloa
    runtime: static
    repo: https://github.com/Murua-Alvaro/PRUEBA
    branch: main
    buildCommand: mkdir -p dist/data dist/agua && cp index.html styles.css app.js agua.css agua-pro.css agua.js dist/ && cp agua/portal-v22.css agua/portal-v22.js dist/agua/ && cp data/analysis-pack.b64 data/agua-v9.json dist/data/
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
